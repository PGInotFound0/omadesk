name: build-android-apk

on:
  push:
    branches: [ main ]
    tags: ['v*']
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
      - "web/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: set up the Android SDK (preinstalled image + license accept)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: build debug + release APKs
        run: |
          cd android
          gradle -v
          gradle -p . assembleDebug assembleRelease --no-daemon

      - name: upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omadesk-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download built APKs
        uses: actions/download-artifact@v4
        with:
          name: omadesk-apk
      - name: attach APKs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" --notes "omadesk Android APK" || true
          gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" -- *.apk --clobber
