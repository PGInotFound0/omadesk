plugins {
    id 'com.android.application'
}

android {
    namespace 'app.omadesk'
    compileSdk 34

    defaultConfig {
        applicationId 'app.omadesk'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            // signed with the debug key so it side-loads without ceremony
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
